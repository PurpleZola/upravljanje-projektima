<h2 mat-dialog-title>Potvrda brisanja</h2>

<mat-dialog-content>
  <p>Da li ste sigurni da želite obrisati ovaj zadatak?</p>
  <p>Ova akcija se ne može poništiti.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onOdustani()">
    <mat-icon>close</mat-icon>
    Odustani
  </button>
  <button mat-raised-button color="warn" (click)="onPotvrdi()">
    <mat-icon>delete</mat-icon>
    Obriši
  </button>
</mat-dialog-actions>
